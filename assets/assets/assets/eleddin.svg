<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="arabianSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="60%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#arabianSky)"/>

  <!-- Golden Crescent Moon & Stars -->
  <path d="M 650 90 A 45 45 0 1 0 710 160 A 38 38 0 1 1 650 90 Z" fill="#FFD54F"/>
  <circle cx="620" cy="140" r="3.5" fill="#FFE082"/>
  <circle cx="580" cy="90" r="2.5" fill="#FFE082"/>

  <!-- Silhouetted Golden Minarets and Domes -->
  <g fill="#E65100" opacity="0.6" transform="translate(100, 320)">
    <rect x="0" y="30" width="50" height="120"/>
    <path d="M 0 30 Q 25 -10 50 30 Z"/>
    <rect x="70" y="60" width="70" height="90"/>
    <path d="M 70 60 Q 105 10 140 60 Z"/>
    <rect x="170" y="10" width="45" height="140"/>
    <path d="M 170 10 Q 192 -30 215 10 Z"/>
    <rect x="240" y="50" width="80" height="100"/>
    <path d="M 240 50 Q 280 0 320 50 Z"/>
  </g>

  <!-- Friendly Blue Genie Rising from Smoke -->
  <g transform="translate(560, 260)">
    <!-- Smoke Trail -->
    <path d="M -60 120 Q -40 70 -20 50 Q 10 30 -10 -20 Q -30 -70 20 -110" stroke="#80D8FF" stroke-width="28" fill="none" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Friendly Genie Torso & Head -->
    <ellipse cx="25" cy="-120" rx="45" ry="50" fill="#00B0FF"/>
    <circle cx="25" cy="-165" r="32" fill="#40C4FF"/>

    <!-- Cheerful Big Smile & Eyes -->
    <circle cx="15" cy="-170" r="5" fill="#FFFFFF"/>
    <circle cx="16" cy="-170" r="3" fill="#01579B"/>
    <circle cx="35" cy="-170" r="5" fill="#FFFFFF"/>
    <circle cx="36" cy="-170" r="3" fill="#01579B"/>
    <path d="M 12 -155 Q 25 -142 38 -155" stroke="#01579B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Golden Wristbands and Earring -->
    <rect x="-15" y="-120" width="14" height="8" fill="#FFD700" rx="2"/>
    <rect x="50" y="-120" width="14" height="8" fill="#FFD700" rx="2"/>
    <circle cx="58" cy="-160" r="6" stroke="#FFD700" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Flying Magic Carpet with Aladdin -->
  <g transform="translate(240, 200) rotate(-8)">
    <!-- Ornate Flying Carpet with Tassels -->
    <path d="M -90 10 Q 0 -15 90 10 Q 70 35 -70 35 Z" fill="#D50000"/>
    <path d="M -80 12 Q 0 -10 80 12 Q 60 30 -60 30 Z" fill="#FFD700" stroke="#C2185B" stroke-width="2"/>
    <!-- Tassels -->
    <circle cx="-85" cy="20" r="4" fill="#FFD700"/>
    <circle cx="85" cy="20" r="4" fill="#FFD700"/>

    <!-- Aladdin Sitting Happily -->
    <g transform="translate(0, -10)">
      <!-- Purple Vest & White Tunic -->
      <ellipse cx="0" cy="5" rx="18" ry="16" fill="#F5F5F5"/>
      <path d="M -14 0 L -14 20 L -2 20 L -6 0 Z" fill="#7B1FA2"/>
      <path d="M 14 0 L 14 20 L 2 20 L 6 0 Z" fill="#7B1FA2"/>
      <!-- Red Fez Hat with Feather -->
      <circle cx="0" cy="-22" r="16" fill="#FFD1A4"/>
      <rect x="-8" y="-36" width="16" height="12" fill="#D50000" rx="2"/>
      <line x1="0" y1="-36" x2="10" y2="-45" stroke="#FFD700" stroke-width="2"/>
      <!-- Happy Face -->
      <circle cx="-5" cy="-24" r="2.5" fill="#2E1C0C"/>
      <circle cx="5" cy="-24" r="2.5" fill="#2E1C0C"/>
      <path d="M -5 -16 Q 0 -10 5 -16" stroke="#D32F2F" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>