<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSlumber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B1D"/>
      <stop offset="60%" stop-color="#1B163B"/>
      <stop offset="100%" stop-color="#2D2254"/>
    </linearGradient>
    <radialGradient id="fairyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="1"/>
      <stop offset="50%" stop-color="#CE93D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CE93D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nightSlumber)"/>

  <!-- Giant Glowing Full Moon -->
  <circle cx="150" cy="140" r="85" fill="#FFF9C4" opacity="0.95"/>
  <circle cx="130" cy="120" r="18" fill="#FFF176" opacity="0.4"/>
  <circle cx="180" cy="155" r="24" fill="#FFF176" opacity="0.4"/>

  <!-- Golden Stars Across the Sky -->
  <g fill="#FFE082">
    <circle cx="320" cy="80" r="3.5"/>
    <circle cx="450" cy="60" r="2.5"/>
    <circle cx="560" cy="110" r="4"/>
    <circle cx="680" cy="70" r="3"/>
    <circle cx="740" cy="140" r="3.5"/>
    <circle cx="380" cy="170" r="2"/>
    <circle cx="620" cy="190" r="2.5"/>
  </g>

  <!-- Sleeping Village on Hills -->
  <path d="M -50 420 Q 200 360 480 430 T 850 400 L 850 500 L -50 500 Z" fill="#130F26"/>
  
  <!-- Little Cozy Cottages with Darkened Sleeping Roofs -->
  <g transform="translate(180, 390)" fill="#1F1A3A">
    <rect x="0" y="20" width="50" height="40"/>
    <polygon points="-5,20 25,0 55,20" fill="#31275C"/>
    <!-- Gentle night light in one window -->
    <rect x="18" y="32" width="14" height="14" fill="#FFE082" opacity="0.6"/>
  </g>
  <g transform="translate(580, 380)" fill="#1F1A3A">
    <rect x="0" y="25" width="60" height="45"/>
    <polygon points="-8,25 30,2 68,25" fill="#31275C"/>
    <rect x="24" y="38" width="14" height="14" fill="#FFE082" opacity="0.4"/>
  </g>

  <!-- Star Fairy (Balaca Pəri) Floating on a Cloud -->
  <g transform="translate(460, 210)">
    <!-- Magical Aura Glow -->
    <circle cx="0" cy="0" r="120" fill="url(#fairyGlow)"/>

    <!-- Translucent Shimmering Butterfly Wings -->
    <g fill="#E1BEE7" opacity="0.75" stroke="#BA68C8" stroke-width="2">
      <!-- Upper wings -->
      <path d="M -15 -10 Q -80 -100 -120 -50 Q -90 10 -20 5 Z"/>
      <path d="M 15 -10 Q 80 -100 120 -50 Q 90 10 20 5 Z"/>
      <!-- Lower wings -->
      <path d="M -10 10 Q -70 40 -90 90 Q -40 80 -10 25 Z"/>
      <path d="M 10 10 Q 70 40 90 90 Q 40 80 10 25 Z"/>
    </g>

    <!-- Fairy Flowing Gown -->
    <path d="M -16 20 Q -40 100 0 110 Q 40 100 16 20 Z" fill="#BA68C8"/>
    <path d="M -12 25 Q 0 95 12 25 Z" fill="#E1BEE7"/>

    <!-- Sweet Fairy Head & Silvery Hair -->
    <circle cx="0" cy="-15" r="24" fill="#FFE0B2"/>
    <!-- Flowing Hair -->
    <path d="M -26 -10 Q -35 -45 0 -45 Q 35 -45 26 -10 Q 35 15 20 30 Q 15 -20 -20 30 Z" fill="#FFF9C4"/>
    
    <!-- Peaceful Smiling Eyes -->
    <path d="M -14 -16 Q -8 -10 -2 -16" stroke="#4A148C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 2 -16 Q 8 -10 14 -16" stroke="#4A148C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Gentle Smile & Cheeks -->
    <path d="M -6 -4 Q 0 2 6 -4" stroke="#E91E63" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-14" cy="-8" r="4" fill="#FF80AB" opacity="0.6"/>
    <circle cx="14" cy="-8" r="4" fill="#FF80AB" opacity="0.6"/>

    <!-- Fairy Wand with Star Tip -->
    <g transform="translate(35, 10)">
      <line x1="-15" y1="20" x2="35" y2="-40" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <!-- Star on Wand Tip -->
      <polygon points="35,-55 39,-43 51,-43 41,-35 45,-23 35,-31 25,-23 29,-35 19,-43 31,-43" fill="#FFEA00"/>
    </g>

    <!-- Trail of Stardust Particles -->
    <g fill="#FFF59D">
      <circle cx="65" cy="-45" r="3"/>
      <circle cx="85" cy="-25" r="2.5"/>
      <circle cx="100" cy="-5" r="2"/>
      <circle cx="120" cy="15" r="3.5"/>
      <circle cx="140" cy="35" r="2"/>
      <circle cx="90" cy="40" r="3"/>
    </g>
  </g>
</svg>