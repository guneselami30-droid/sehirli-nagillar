<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="magicSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28114B"/>
      <stop offset="50%" stop-color="#4A1E73"/>
      <stop offset="100%" stop-color="#FF9E80"/>
    </linearGradient>
    <linearGradient id="emeraldWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Magic Twilight Sky -->
  <rect width="800" height="500" fill="url(#magicSky)"/>

  <!-- Distant Golden Palaces on the Horizon -->
  <g transform="translate(540, 260)" fill="#FFE082" opacity="0.6">
    <rect x="0" y="40" width="80" height="120"/>
    <path d="M 0 40 Q 40 -20 80 40 Z"/>
    <rect x="90" y="70" width="50" height="90"/>
    <path d="M 90 70 Q 115 20 140 70 Z"/>
    <rect x="150" y="20" width="60" height="140"/>
    <path d="M 150 20 Q 180 -40 210 20 Z"/>
    <line x1="40" y1="-20" x2="40" y2="-45" stroke="#FFD700" stroke-width="3"/>
    <circle cx="40" cy="-45" r="4" fill="#FFD700"/>
  </g>

  <!-- Fluffy Cloudscape -->
  <g fill="#FFF3E0" opacity="0.75">
    <ellipse cx="120" cy="420" rx="160" ry="80"/>
    <ellipse cx="280" cy="440" rx="140" ry="70"/>
    <ellipse cx="500" cy="430" rx="180" ry="90"/>
    <ellipse cx="720" cy="440" rx="140" ry="80"/>
  </g>

  <!-- The Legendary Simurgh / Zümrüd Quşu -->
  <g transform="translate(360, 210)">
    <!-- Glowing Tail Plumes -->
    <path d="M -80 60 Q -180 120 -260 90 Q -190 60 -80 30" fill="url(#emeraldWing)" opacity="0.9"/>
    <path d="M -70 80 Q -160 180 -250 170 Q -160 110 -60 50" fill="#FFD700" opacity="0.8"/>
    <path d="M -60 90 Q -120 220 -200 240 Q -130 150 -50 70" fill="#00E676" opacity="0.8"/>

    <!-- Mighty Emerald & Golden Left Wing -->
    <path d="M -40 -10 Q -90 -160 -40 -220 Q 30 -140 10 -20 Z" fill="url(#emeraldWing)"/>
    <path d="M -10 -20 Q -40 -130 0 -180 Q 50 -120 30 -20 Z" fill="#FFEA00" opacity="0.8"/>

    <!-- Bird Sleek Body -->
    <path d="M -70 40 Q 20 50 70 0 Q 20 -30 -70 10 Z" fill="#00B0FF"/>
    <ellipse cx="20" cy="15" rx="55" ry="32" fill="#00E5FF"/>

    <!-- Bird Graceful Head with Golden Crest -->
    <path d="M 60 -5 Q 95 -25 115 0 Q 95 20 60 15 Z" fill="#00E676"/>
    <!-- Golden Beak -->
    <polygon points="115,-3 145,5 115,12" fill="#FFD700"/>
    <!-- Gentle Eye -->
    <circle cx="95" cy="0" r="5" fill="#212121"/>
    <circle cx="97" cy="-2" r="2" fill="#FFFFFF"/>
    <!-- Crown Crest -->
    <path d="M 85 -20 Q 95 -50 115 -45 Q 95 -30 90 -15" fill="#FFD700"/>
    <circle cx="115" cy="-45" r="4" fill="#FF1744"/>

    <!-- Mighty Right Wing (Front) -->
    <path d="M 10 10 Q 80 -120 180 -160 Q 140 -60 50 30 Z" fill="url(#emeraldWing)"/>

    <!-- Brave Young Prince Melikmammad Riding the Bird -->
    <g transform="translate(15, -25)">
      <!-- Royal Cape -->
      <path d="M -10 10 Q -40 25 -60 15 Q -30 5 -5 5 Z" fill="#D50000"/>
      <!-- Body with Golden Belt -->
      <ellipse cx="5" cy="10" rx="14" ry="18" fill="#1E88E5"/>
      <rect x="-6" y="16" width="22" height="6" fill="#FFD700"/>
      <!-- Prince Head with Royal Circlet -->
      <circle cx="5" cy="-12" r="14" fill="#FFCCBC"/>
      <ellipse cx="9" cy="-14" rx="2.5" ry="3.5" fill="#212121"/>
      <circle cx="10" cy="-15" r="1" fill="#FFFFFF"/>
      <path d="M 6 -6 Q 10 -2 14 -6" stroke="#D32F2F" stroke-width="2" fill="none"/>
      <!-- Golden Crown / Circlet -->
      <path d="M -6 -20 L 16 -20 L 14 -26 L 5 -22 L -4 -26 Z" fill="#FFD700"/>
      <!-- Raised Waving Hand -->
      <path d="M 12 5 L 26 -8" stroke="#FFCCBC" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>