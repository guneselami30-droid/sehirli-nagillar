<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky & Aurora Gradients -->
    <linearGradient id="snowSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="70%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Aurora Borealis Glow -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Snow Hills Gradients -->
    <linearGradient id="snowHillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="snowHillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Ice Crystal Gradient -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Lantern Warm Light -->
    <radialGradient id="warmLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Snowflake symbol -->
    <g id="snowflake">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6" stroke="#E0E7FF" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6" stroke="#E0E7FF" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Star symbol -->
    <g id="star">
      <circle cx="0" cy="0" r="2" fill="#FDF4FF"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#FDF4FF" stroke-width="0.8"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#FDF4FF" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#snowSky)"/>

  <!-- Northern Lights Waves (Qütb İşıqları) -->
  <path d="M0 120 Q180 60 360 130 T720 100 T800 120 L800 280 Q620 230 400 290 T0 260 Z" fill="url(#auroraGlow)"/>
  <path d="M0 180 Q220 120 440 190 T800 160 L800 320 Q580 270 320 330 T0 300 Z" fill="url(#auroraGlow)" opacity="0.7"/>

  <!-- Twinkling Night Stars -->
  <use href="#star" x="60" y="50"/>
  <use href="#star" x="140" y="80"/>
  <use href="#star" x="220" y="40"/>
  <use href="#star" x="320" y="90"/>
  <use href="#star" x="420" y="45"/>
  <use href="#star" x="520" y="85"/>
  <use href="#star" x="620" y="35"/>
  <use href="#star" x="720" y="70"/>
  <use href="#star" x="760" y="130"/>
  <use href="#star" x="90" y="140"/>

  <!-- Distant Crystal Ice Castle (Qar Qəsri - yumşaq və sehrli) -->
  <g opacity="0.85" transform="translate(480, 160)">
    <!-- Main Spire -->
    <polygon points="120,40 100,160 140,160" fill="url(#iceGrad)" opacity="0.9"/>
    <polygon points="70,80 55,160 85,160" fill="url(#iceGrad)" opacity="0.75"/>
    <polygon points="170,80 155,160 185,160" fill="url(#iceGrad)" opacity="0.75"/>
    <!-- Castle Walls -->
    <rect x="40" y="160" width="160" height="70" rx="6" fill="#C7D2FE" opacity="0.7"/>
    <circle cx="120" cy="110" r="8" fill="#FEF08A" opacity="0.9"/>
    <!-- Magical Star on Top Spire -->
    <use href="#star" x="120" y="35"/>
  </g>

  <!-- Distant Snow Mountains -->
  <path d="M0 380 Q160 300 340 370 T680 340 T800 370 L800 600 L0 600 Z" fill="url(#snowHillFar)"/>

  <!-- Magical Snow Covered Fir Trees -->
  <g transform="translate(620, 310)">
    <polygon points="40,20 20,60 60,60" fill="#312E81"/>
    <polygon points="40,40 10,90 70,90" fill="#1E1B4B"/>
    <polygon points="40,70 0,130 80,130" fill="#0F172A"/>
    <!-- Snow blankets on tree -->
    <path d="M20 60 Q40 50 60 60" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M10 90 Q40 80 70 90" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 130 Q40 120 80 130" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(710, 340) scale(0.75)">
    <polygon points="40,20 20,60 60,60" fill="#312E81"/>
    <polygon points="40,40 10,90 70,90" fill="#1E1B4B"/>
    <polygon points="40,70 0,130 80,130" fill="#0F172A"/>
    <path d="M20 60 Q40 50 60 60" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M10 90 Q40 80 70 90" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <path d="M0 130 Q40 120 80 130" stroke="#FFFFFF" stroke-width="6" fill="none"/>
  </g>

  <!-- Near Snow Hill (Qar Təpəsi) -->
  <path d="M0 450 Q220 400 480 460 T800 440 L800 600 L0 600 Z" fill="url(#snowHillNear)"/>

  <!-- Warm Wooden Sledge / Cottage Lantern in Far Background -->
  <circle cx="210" cy="460" r="70" fill="url(#warmLight)"/>

  <!-- ==================== CUTE REINDEER (Şirin Maral) ==================== -->
  <g transform="translate(180, 360)">
    <!-- Body -->
    <ellipse cx="140" cy="110" rx="55" ry="38" fill="#B45309"/>
    <ellipse cx="140" cy="110" rx="48" ry="32" fill="#D97706"/>
    <!-- Legs -->
    <rect x="105" y="130" width="12" height="60" rx="6" fill="#92400E"/>
    <rect x="125" y="135" width="11" height="55" rx="5" fill="#78350F"/>
    <rect x="155" y="130" width="12" height="60" rx="6" fill="#92400E"/>
    <rect x="175" y="135" width="11" height="55" rx="5" fill="#78350F"/>
    <!-- Cute Tail -->
    <ellipse cx="82" cy="98" rx="10" ry="14" fill="#FEF3C7" transform="rotate(-30 82 98)"/>
    <!-- Neck -->
    <path d="M170 100 L200 60 L218 70 L195 115 Z" fill="#D97706"/>
    <!-- Head -->
    <circle cx="215" cy="55" r="22" fill="#D97706"/>
    <ellipse cx="230" cy="62" rx="14" ry="10" fill="#FDE68A"/>
    <!-- Black nose with cute highlight -->
    <ellipse cx="242" cy="60" rx="4" ry="3" fill="#1F2937"/>
    <circle cx="241" cy="59" r="1.2" fill="#FFFFFF"/>
    <!-- Smiling Mouth -->
    <path d="M232 66 Q238 72 242 66" stroke="#78350F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Big Friendly Reindeer Eye -->
    <circle cx="215" cy="50" r="5" fill="#1F2937"/>
    <circle cx="213" cy="48" r="2" fill="#FFFFFF"/>
    <!-- Cute Ears -->
    <ellipse cx="196" cy="46" rx="6" ry="12" fill="#B45309" transform="rotate(-35 196 46)"/>
    <ellipse cx="196" cy="46" rx="3.5" ry="8" fill="#FDE68A" transform="rotate(-35 196 46)"/>
    <!-- Cute Golden Antlers (Maralın Buynuzları) -->
    <path d="M205 38 Q200 15 210 5 Q212 15 220 22" stroke="#F59E0B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M205 22 Q195 18 190 22" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M214 40 Q225 18 240 10 Q235 22 232 28" stroke="#F59E0B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Festive Red Bell Collar (Zınqırovlu şal) -->
    <path d="M190 85 Q205 95 215 80" stroke="#DC2626" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="204" cy="92" r="5" fill="#FBBF24"/>
    <circle cx="204" cy="92" r="2" fill="#92400E"/>
  </g>

  <!-- ==================== CUTE GERDA (Cəsur və Mehriban Gerda) ==================== -->
  <g transform="translate(430, 310)">
    <!-- Red Warm Winter Hood & Coat -->
    <!-- Coat Skirt -->
    <path d="M50 170 L20 240 Q60 255 100 240 L70 170 Z" fill="#DC2626"/>
    <!-- White Fur Trim on Skirt -->
    <path d="M18 240 Q60 255 102 240 Q60 245 18 240" fill="#FFFFFF"/>
    <ellipse cx="60" cy="245" rx="42" ry="6" fill="#F1F5F9"/>

    <!-- Cute Winter Boots -->
    <ellipse cx="44" cy="254" rx="10" ry="7" fill="#78350F"/>
    <ellipse cx="76" cy="254" rx="10" ry="7" fill="#78350F"/>

    <!-- Coat Body -->
    <path d="M38 120 L30 175 Q60 185 90 175 L82 120 Z" fill="#B91C1C"/>
    <!-- Golden Buttons -->
    <circle cx="60" cy="135" r="3" fill="#FBBF24"/>
    <circle cx="60" cy="150" r="3" fill="#FBBF24"/>
    <circle cx="60" cy="165" r="3" fill="#FBBF24"/>

    <!-- Warm White Mittens (İsti əlcəklər) -->
    <!-- Left Hand holding lantern -->
    <circle cx="16" cy="155" r="8" fill="#F8FAFC"/>
    <!-- Right Hand waving / holding heart rose -->
    <circle cx="104" cy="150" r="8" fill="#F8FAFC"/>
    <line x1="38" y1="125" x2="16" y2="155" stroke="#B91C1C" stroke-width="12" stroke-linecap="round"/>
    <line x1="82" y1="125" x2="104" y2="150" stroke="#B91C1C" stroke-width="12" stroke-linecap="round"/>

    <!-- Magical Glowing Lantern in Gerda's Hand -->
    <g transform="translate(16, 155)">
      <circle cx="0" cy="20" r="28" fill="url(#warmLight)"/>
      <rect x="-8" y="8" width="16" height="22" rx="4" fill="#78350F"/>
      <rect x="-5" y="11" width="10" height="16" rx="2" fill="#FEF08A"/>
      <circle cx="0" cy="19" r="4" fill="#F59E0B"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D97706" stroke-width="2"/>
    </g>

    <!-- Warm Fur Scarf (Şərf) -->
    <path d="M40 115 Q60 125 80 115 Q75 135 60 135 Q45 135 40 115" fill="#FEF3C7"/>
    <rect x="62" y="125" width="10" height="25" rx="3" fill="#FEF3C7" transform="rotate(15 62 125)"/>

    <!-- Red Fairytale Hood (Qırmızı Kapüşon) -->
    <circle cx="60" cy="85" r="35" fill="#DC2626"/>
    <!-- White fur rim on hood -->
    <circle cx="60" cy="85" r="28" fill="#FFFFFF"/>

    <!-- Gerda's Sweet Smiling Face -->
    <circle cx="60" cy="86" r="22" fill="#FED7AA"/>

    <!-- Cute Rosy Cheeks (Qırmızı yanaqlar) -->
    <ellipse cx="49" cy="93" rx="4.5" ry="3" fill="#F87171" opacity="0.6"/>
    <ellipse cx="71" cy="93" rx="4.5" ry="3" fill="#F87171" opacity="0.6"/>

    <!-- Golden Bangs Hair -->
    <path d="M43 74 Q60 68 77 74 Q70 82 60 80 Q50 82 43 74" fill="#F59E0B"/>

    <!-- Big Sparkling Child Eyes -->
    <circle cx="51" cy="84" r="3.5" fill="#1E293B"/>
    <circle cx="50" cy="83" r="1.2" fill="#FFFFFF"/>
    <circle cx="69" cy="84" r="3.5" fill="#1E293B"/>
    <circle cx="68" cy="83" r="1.2" fill="#FFFFFF"/>

    <!-- Cheerful Sweet Smile -->
    <path d="M54 95 Q60 102 66 95" stroke="#991B1B" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Warm Glowing Red Rose in Hand (Qay və Gerdanın sevimli gülü) -->
    <g transform="translate(108, 142) scale(0.9)">
      <circle cx="0" cy="0" r="9" fill="#E11D48"/>
      <circle cx="-2" cy="-2" r="5" fill="#F43F5E"/>
      <circle cx="0" cy="0" r="3" fill="#FECDD3"/>
      <path d="M-2 6 Q0 14 4 18" stroke="#16A34A" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- ==================== DANCING MAGICAL SNOWFLAKES ==================== -->
  <use href="#snowflake" x="120" y="240" transform="scale(1.2)"/>
  <use href="#snowflake" x="260" y="290"/>
  <use href="#snowflake" x="380" y="220" transform="scale(0.8)"/>
  <use href="#snowflake" x="590" y="270" transform="scale(1.3)"/>
  <use href="#snowflake" x="720" y="230"/>
  <use href="#snowflake" x="160" y="480" transform="scale(0.9)"/>
  <use href="#snowflake" x="340" y="520" transform="scale(1.1)"/>
  <use href="#snowflake" x="520" y="490"/>
  <use href="#snowflake" x="690" y="510" transform="scale(0.8)"/>
  <use href="#snowflake" x="70" y="360" transform="scale(1.1)"/>

  <!-- Magical Sparkle Stars around Gerda -->
  <use href="#star" x="420" y="270"/>
  <use href="#star" x="560" y="320"/>
  <use href="#star" x="490" y="250"/>
  <use href="#star" x="370" y="340"/>

  <!-- Fairytale Caption Ribbon at Top -->
  <g transform="translate(400, 38)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1E1B4B" opacity="0.85" stroke="#A5F3FC" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
      ❄️ ANDERSEN: QAR KRALİÇASI VƏ GERDANIN İSTİ ÜRƏYİ ✨
    </text>
  </g>
</svg>
