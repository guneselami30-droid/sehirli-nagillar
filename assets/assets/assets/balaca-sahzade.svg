<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cosmicSky)"/>

  <!-- Multitude of Twinkling Stars -->
  <g fill="#FFF9C4">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="180" cy="130" r="2"/>
    <circle cx="280" cy="60" r="4"/>
    <circle cx="400" cy="100" r="2.5"/>
    <circle cx="520" cy="50" r="3.5"/>
    <circle cx="650" cy="80" r="3"/>
    <circle cx="740" cy="120" r="4"/>
    <circle cx="700" cy="220" r="2"/>
  </g>

  <!-- Distant Planet with Rings -->
  <g transform="translate(640, 100)">
    <circle r="30" fill="#FFE082"/>
    <ellipse rx="55" ry="12" fill="none" stroke="#FFD54F" stroke-width="4" transform="rotate(-20)"/>
  </g>

  <!-- Tiny Grassy Asteroid Planet B-612 -->
  <g transform="translate(400, 520)">
    <circle r="220" fill="#388E3C" stroke="#2E7D32" stroke-width="6"/>
  </g>

  <!-- The Special Red Rose under a Glass Dome -->
  <g transform="translate(290, 315)">
    <!-- Glass Dome -->
    <path d="M -18 35 L -18 10 Q -18 -30 0 -30 Q 18 -30 18 10 L 18 35 Z" fill="#E1F5FE" opacity="0.6" stroke="#81D4FA" stroke-width="2"/>
    <circle cx="0" cy="-30" r="4" fill="#81D4FA"/>
    <!-- The Rose -->
    <path d="M 0 35 L 0 5" stroke="#2E7D32" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#D50000"/>
    <circle cx="2" cy="-2" r="4" fill="#FF1744"/>
  </g>

  <!-- Cute Little Prince Character -->
  <g transform="translate(410, 240)">
    <!-- Green Tunic Suit -->
    <path d="M -16 40 L -22 100 L 22 100 L 16 40 Z" fill="#66BB6A" stroke="#43A047" stroke-width="2"/>
    <rect x="-18" y="70" width="36" height="8" fill="#FFD700"/>

    <!-- Legs & Shoes -->
    <rect x="-16" y="100" width="12" height="28" fill="#66BB6A"/>
    <rect x="4" y="100" width="12" height="28" fill="#66BB6A"/>
    <ellipse cx="-10" cy="128" rx="8" ry="4" fill="#5D4037"/>
    <ellipse cx="10" cy="128" rx="8" ry="4" fill="#5D4037"/>

    <!-- Long Floating Golden Scarf -->
    <path d="M -12 36 Q -50 30 -90 10 Q -40 45 -8 42 Z" fill="#FFD700"/>

    <!-- Prince Head with Tousled Golden Hair -->
    <circle cx="0" cy="15" r="22" fill="#FFE0B2"/>
    <path d="M -22 10 Q -30 -20 0 -22 Q 30 -20 22 10 Q 15 -10 -5 -10 Z" fill="#FFEE58"/>
    <path d="M -10 -15 L -5 -28 L 5 -18 L 14 -26 L 18 -10" fill="#FFEE58"/>

    <!-- Sweet Eyes & Smile -->
    <ellipse cx="-7" cy="14" rx="2.5" ry="3.5" fill="#2E1C0C"/>
    <ellipse cx="7" cy="14" rx="2.5" ry="3.5" fill="#2E1C0C"/>
    <path d="M -6 24 Q 0 30 6 24" stroke="#D32F2F" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- The Fluffy Orange Little Fox Sitting Gently -->
  <g transform="translate(510, 315)">
    <!-- Bushy Tail with White Tip -->
    <path d="M 20 25 Q 70 20 60 -15 Q 40 10 10 20 Z" fill="#E65100"/>
    <path d="M 60 -15 Q 55 -5 45 5 Q 55 10 60 -15 Z" fill="#FFFFFF"/>

    <!-- Fox Body -->
    <ellipse cx="0" cy="20" rx="22" ry="26" fill="#EF6C00"/>
    <ellipse cx="-4" cy="22" rx="12" ry="16" fill="#FFF3E0"/>

    <!-- Fox Head & Big Ears -->
    <circle cx="-10" cy="-12" r="18" fill="#EF6C00"/>
    <!-- Ears -->
    <polygon points="-24,-20 -28,-45 -12,-30" fill="#EF6C00"/>
    <polygon points="-22,-22 -26,-40 -15,-28" fill="#4E342E"/>
    <polygon points="-2,-22 8,-45 10,-24" fill="#EF6C00"/>
    <polygon points="0,-22 6,-40 8,-26" fill="#4E342E"/>

    <!-- White Snout and Black Nose -->
    <polygon points="-24,-10 -35,-8 -22,-2" fill="#FFFFFF"/>
    <circle cx="-35" cy="-8" r="3" fill="#212121"/>
    
    <!-- Gentle Fox Eye -->
    <path d="M -18 -15 Q -14 -20 -10 -15" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>